name: Lint, Build & Test
on:
  push:
    branches:
      - rolling
  pull_request:
    branches:
      - rolling
defaults:
  run:
    shell: bash

jobs:
  Linting:
    name: Lint Code Base
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        run: | # qmlformat is in the dev tools
          sudo apt-get update && sudo apt-get install -y clang-format cppcheck libxml2-utils qt6-declarative-dev-tools
          sudo ln -s /usr/lib/qt6/bin/qmlformat /usr/local/bin/qmlformat

      - name: Install and Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  build-and-test:
    needs: Linting
    strategy:
      matrix:
        setup:
          - rosdistro: jazzy
            os: ubuntu-24.04
          - rosdistro: lyrical
            os: ubuntu-26.04
        # Platform themes change key handling, e.g. GTK presses buttons on Return.
        theme: [default, gtk3]
    runs-on: ${{ matrix.setup.os }}
    container:
      image: ros:${{ matrix.setup.rosdistro }}-ros-base
    steps:
      - name: install build tools and latest testing repo
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-dev-tools ros2-testing-apt-source
          sudo apt-get update
      - uses: actions/checkout@v4
        with:
          path: src/repo
      - name: rosdep
        run: |
          rosdep update --rosdistro ${{ matrix.setup.rosdistro }} --include-eol-distros
          rosdep install -y --from-paths src --ignore-src --rosdistro ${{ matrix.setup.rosdistro }}
      - name: install platform theme
        if: matrix.theme == 'gtk3'
        run: sudo apt-get install -y qt6-gtk-platformtheme xvfb
      - name: build
        run: |
          source /opt/ros/${{ matrix.setup.rosdistro }}/setup.bash
          colcon build
      - name: test
        env:
          QT_QPA_PLATFORMTHEME: ${{ matrix.theme != 'default' && matrix.theme || '' }}
        run: |
          source /opt/ros/${{ matrix.setup.rosdistro }}/setup.bash
          # GTK exits without a display, even with the offscreen Qt platform.
          ${{ matrix.theme == 'gtk3' && 'xvfb-run -a' || '' }} colcon test --packages-select rqml_core rqml_default_plugins
          colcon test-result --verbose
